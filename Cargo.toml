[workspace]
resolver = "2"
members = ["crates/forest-core", "crates/road-core", "crates/dz-core", "crates/dz-editor"]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["MrKamil404"]
repository = "https://github.com/MrKamil404/DZWorldEditor"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rayon = "1.10"
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg", "tga"] }
rand = "0.8"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
strip = true
