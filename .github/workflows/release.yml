name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: Swatinem/rust-cache@v2
      - name: Test
        shell: pwsh
        run: |
          cmd /c "cargo test --workspace --release --no-fail-fast > test.log 2>&1"
          $code = $LASTEXITCODE
          Get-Content test.log
          Select-String -CaseSensitive -Path test.log -Pattern 'panicked at|^test .* FAILED|^error' -Context 0,1 | Select-Object -First 9 | ForEach-Object {
            $next = ($_.Context.PostContext -join ' ')
            Write-Output "::error::$($_.Line) $next"
          }
          exit $code
      - run: cargo build --release -p dz-editor
        if: startsWith(github.ref, 'refs/tags/')
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: target/release/DZWorldEditor.exe
          generate_release_notes: true
