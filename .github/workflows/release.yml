name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: Swatinem/rust-cache@v2
      - name: Test
        shell: pwsh
        run: |
          cmd /c "cargo test --workspace --release --no-fail-fast > test.log 2>&1"
          $code = $LASTEXITCODE
          Get-Content test.log
          Select-String -CaseSensitive -Path test.log -Pattern 'panicked at|^test .* FAILED|^error' -Context 0,1 | Select-Object -First 9 | ForEach-Object {
            $next = ($_.Context.PostContext -join ' ')
            Write-Output "::error::$($_.Line) $next"
          }
          exit $code
      - run: cargo build --release -p dz-editor
        if: startsWith(github.ref, 'refs/tags/')
      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ver = '${{ github.ref_name }}'.TrimStart('v')
          $out = @(); $on = $false
          foreach ($l in Get-Content CHANGELOG.md) {
            if ($l -match '^## ') { if ($on) { break }; $on = ($l -eq "## $ver"); continue }
            if ($on) { $out += $l }
          }
          if ($out.Count -eq 0) { throw "No CHANGELOG.md section for $ver" }
          Set-Content release-notes.md ($out -join "`n").Trim()
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: target/release/DZWorldEditor.exe
          body_path: release-notes.md
